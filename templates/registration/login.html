{% load static %}
<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accedi — Documentale</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body class="h-full bg-brand-900 flex items-center justify-center">
  <div class="w-full max-w-sm px-4">
    <!-- Logo / Brand -->
    <div class="text-center mb-8">
      <span class="text-5xl">📋</span>
      <h1 class="text-2xl font-bold text-white mt-3 tracking-tight">Documentale</h1>
      <p class="text-blue-300 text-sm mt-1">Sistema di gestione documentale</p>
    </div>

    <!-- Form card -->
    <div class="bg-white rounded-xl shadow-2xl p-8">
      <h2 class="text-lg font-semibold text-gray-800 mb-6 text-center">Accedi al sistema</h2>

      <form method="post">
        {% csrf_token %}

        {% if form.errors %}
        <div class="alert-danger mb-5">
          Credenziali non valide. Riprova.
        </div>
        {% endif %}

        <div class="form-group">
          <label class="form-label" for="id_username">Nome utente</label>
          <input type="text" name="username" id="id_username"
                 autocomplete="username"
                 class="block w-full rounded-md border border-gray-300 shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500 text-sm py-2.5 px-3 transition-colors"
                 required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="id_password">Password</label>
          <input type="password" name="password" id="id_password"
                 autocomplete="current-password"
                 class="block w-full rounded-md border border-gray-300 shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500 text-sm py-2.5 px-3 transition-colors"
                 required>
        </div>

        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button type="submit" class="btn-primary w-full justify-center mt-2 py-2.5">
          Accedi
        </button>
      </form>
    </div>

    <p class="text-center text-blue-400 text-xs mt-6">
      Sistema documentale interno — accesso riservato
    </p>
  </div>
</body>
</html>
